services:
  - type: web
    name: night-out-together
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    disk:
      name: nightout-data
      mountPath: /data
      sizeGB: 1
